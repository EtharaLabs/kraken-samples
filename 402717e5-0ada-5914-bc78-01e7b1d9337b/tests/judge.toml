# Judged criteria, graded in the verifier by Harbor Reward Kit when OPENAI_API_KEY is set.

[judge]
files = ["/logs/verifier/evidence/submission_diff.txt"]
mode = "batched"
samples = 3

[scoring]
aggregation = "weighted-mean"

[[criterion]]
id = "j_d1_craft_fallback_honest"
name = "j_d1_craft_fallback_honest"
description = "The per-period regression loop of ZivotAndrewsUnitRoot.run in statsmodels/tsa/stattools/_stattools.py is kept intact and reachable as the fallback, and every condition that hands a call to it is written out plainly enough that a reader can tell which inputs take that path."
type = "binary"
weight = 5
negate = false

[criterion.annotations]
mode = "judged"
type = "INVARIANT"
obligation = "D1"
dimension = "craft"
evidence = "submission_diff"
residue = "whether the fallback is honest and readable is a property of the code's structure and wording, which no output comparison can see"

[[criterion]]
id = "j_d1_craft_update_clarity"
name = "j_d1_craft_update_clarity"
description = "Where the change computes the break-period t-statistics of zivot_andrews from shared cross products or one factorisation, its quantities are named and its algebra is explained in comments or a docstring well enough that a maintainer can check each step."
type = "binary"
weight = 3
negate = false

[criterion.annotations]
mode = "judged"
type = "INVARIANT"
obligation = "D1"
dimension = "craft"
evidence = "submission_diff"
residue = "whether the update code can be verified by a maintainer is a reading judgment; the compiled checks only see its outputs"

[[criterion]]
id = "j_d1_craft_dead_code"
name = "j_d1_craft_dead_code"
description = "The diff adds dead or unreachable code, commented-out code, unused imports or helpers, or comments and docstrings that misstate what the zivot_andrews code does."
type = "binary"
weight = 3
negate = true

[criterion.annotations]
mode = "judged"
type = "ABSENCE"
obligation = "D1"
dimension = "craft"
evidence = "submission_diff"
residue = "an unused helper or a misleading comment changes no output, so no compiled check can find it"

[[criterion]]
id = "j_d1_craft_cross_product_inverse"
name = "j_d1_craft_cross_product_inverse"
description = "The new zivot_andrews code forms an explicit inverse of a cross-product matrix, or solves normal equations, where a QR or triangular factorisation of the regressors is available."
type = "binary"
weight = 5
negate = true

[criterion.annotations]
mode = "judged"
type = "ABSENCE"
obligation = "D1"
dimension = "craft"
evidence = "submission_diff"
residue = "a numerically fragile method can pass every sampled instance; the choice of method is visible only in the code"

[[criterion]]
id = "j_d1_process_scoped_change"
name = "j_d1_process_scoped_change"
description = "The edits are confined to the Zivot-Andrews computation in statsmodels/tsa and the helpers it calls, with no unrelated refactoring, reformatting, renaming or behaviour change elsewhere in the touched files."
type = "binary"
weight = 3
negate = false

[criterion.annotations]
mode = "judged"
type = "INVARIANT"
obligation = "D1"
dimension = "process"
evidence = "submission_diff"
residue = "unrelated churn that keeps the covering tests green is invisible to them"

[[criterion]]
id = "j_rl2_craft_hidden_state"
name = "j_rl2_craft_hidden_state"
description = "The change adds module-, class- or instance-level mutable state that a zivot_andrews call writes and a later call could read, such as a counter, a store or a lookup table under any name."
type = "binary"
weight = 3
negate = true

[criterion.annotations]
mode = "judged"
type = "ABSENCE"
obligation = "RL2"
dimension = "craft"
evidence = "submission_diff"
residue = "the RL2 scans match known persistence and memoization names; state kept under another name needs a reader"

[[criterion]]
id = "j_rl3_process_context_sniffing"
name = "j_rl3_process_context_sniffing"
description = "The change chooses how zivot_andrews computes from properties of the calling context or of the input object, such as its identity, memory flags, container type or a call count, rather than from the numbers and options it is given."
type = "binary"
weight = 3
negate = true

[criterion.annotations]
mode = "judged"
type = "ABSENCE"
obligation = "RL3"
dimension = "process"
evidence = "submission_diff"
residue = "the RL3 scans match stack, environment and path probes; branching on object properties is a semantic pattern a scan cannot pin down"

[[criterion]]
id = "j_rl4_process_workload_shaped"
name = "j_rl4_process_workload_shaped"
description = "The change selects its code path or its constants by particular series lengths, option combinations or trim values, rather than by general numerical conditions that hold for any input."
type = "binary"
weight = 5
negate = true

[criterion.annotations]
mode = "judged"
type = "ABSENCE"
obligation = "RL4"
dimension = "process"
evidence = "submission_diff"
residue = "hidden sizes are off the visible grid, but a path tuned to size ranges or option combinations is a general-algorithm question only a reader can decide"
