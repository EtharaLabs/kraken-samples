schema_version = "1.4"

# D1: the modified repository working tree. Harbor snapshots it out of the agent
# container and re-materializes it at the same path in the separate verifier.
artifacts = [
  { source = "/app/pennylane", exclude = [".git", "__pycache__", "*.pyc", ".pytest_cache", "*.egg-info", "build"] },
]

[task]
name = "ethara/pennylane-capture-wrapped-operator-tracing"
version = "0.1.0"
description = "Make PennyLane program capture of long circuits faster without changing any captured program. Continuous reward: per-circuit-kind speedup on hidden, seed-randomized circuits relative to a reference solution, zero on any changed program, failed covering test, or red line."
authors = [{ name = "ankit.ethara", email = "ankit.ethara@ethara.ai" }]
keywords = ["python", "pennylane", "jax", "program-capture", "performance-optimization", "credit-assignment", "continuous-reward"]

[metadata]
null_floor = 0.0
discrimination_weight = 0.5
platforms = ["linux/amd64", "linux/arm64"]
archetype = "perf-optimization-fn"
category = "credit-assignment"
tags = ["optimization", "bounded-continuous"]

[agent]
timeout_sec = 7200.0
network_mode = "no-network"
user = "1000:1000"

[verifier]
timeout_sec = 5400.0
network_mode = "no-network"
environment_mode = "separate"
# The harness must demote every run of submission code to a restricted uid with a
# fresh HOME and TMPDIR and no write access to the harness or the measurement record.
user = "root"

# Judge binding, resolved from the run host at run time; no value lives in the bundle.
[verifier.env]
REWARDKIT_JUDGE = "${REWARDKIT_JUDGE}"
KRAKEN_JUDGE_LINEAGE = "${KRAKEN_JUDGE_LINEAGE}"
LITELLM_PROXY_API_BASE = "${LITELLM_PROXY_API_BASE}"
LITELLM_PROXY_API_KEY = "${LITELLM_PROXY_API_KEY}"

[verifier.environment]
network_mode = "no-network"
build_timeout_sec = 3600.0
cpus = 2
memory_mb = 6144
storage_mb = 20480
gpus = 0

[environment]
network_mode = "no-network"
build_timeout_sec = 3600.0
cpus = 2
memory_mb = 6144
storage_mb = 20480
gpus = 0

[upstream_provenance]
origin = "original"
provenance_date = "2026-10-26"
source_kind = "public_repository"
no_upstream_lift = true

