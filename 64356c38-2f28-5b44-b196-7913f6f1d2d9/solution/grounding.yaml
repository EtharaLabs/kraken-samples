  - id: d1_robustness_timed_program_equality
    obligation: D1
    dimension: robustness
    weight: 3
    negate: false
    evaluation_target: workload_output
    criterion: "Every timed hidden workload (five families, two sizes each, five repetitions) traces to the same str(jaxpr) digest on the graded tree as on the base commit (checker C3)."
    judgment: {type: DIVERGENCE, relation: check_timed_digests}
    evidence: [/logs/verifier/evidence/workload_output.json]
