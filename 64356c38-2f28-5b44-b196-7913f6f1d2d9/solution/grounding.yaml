# Discovery values (item 10a.1). Each is established in the built environment at
# the location named; none is stated in instruction.md. recompute.py re-derives
# the source locations from the base tree when it is present.
discovery:
  - id: DV1
    contract_value: the cost sits in pop_op_eqns in pennylane/core/queuing.py, reached from the constructors of symbolic operators that take an already-traced base
    contract_wording: the contract names pennylane/core/queuing.py; at the base commit the function is defined in pennylane/core/operator/operator2.py and queuing.py reaches it through remove_from_program
    established_at:
      - {file: pennylane/core/operator/operator2.py, symbol: pop_op_eqns}
      - {file: pennylane/core/queuing.py, symbol: remove_from_program}
  - id: DV2
    contract_value: each removal rebuilds frame.tracing_eqns, and every wrapped operator triggers one removal, so the work is quadratic in the number of operators
    established_at:
      - {file: pennylane/core/operator/operator2.py, symbol: pop_op_eqns, needle: "frame.tracing_eqns = [r for r in frame.tracing_eqns if r() is not eqn]"}
  - id: DV3
    contract_value: removals can be grouped per frame and done in one backward sweep keyed by equation identity, stopping once every target is removed
    established_at:
      - {file: solution/reference.patch, symbol: pop_op_eqns}
  - id: DV4
    contract_value: the hidden workloads mix CNOT, Controlled and nested Adjoint chains, so each wrapper path earns its own share of the reward
    realized_as: five families in two equal halves of the timed credit (contract revision 7) - the single-removal half is CNOT-style, Controlled, Adjoint and Adjoint of Controlled at one eighth each, and the batch-removal half is one qp.prod over many factors
    established_at:
      - {file: tests/harness/workloads.py, symbol: FAMILIES}
