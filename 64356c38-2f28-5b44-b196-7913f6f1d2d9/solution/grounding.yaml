oracle:
  applier: solution/apply.py
  rule: >-
    solution/solve.sh is a ladder. Each live line is one command that applies one staged sub-patch under
    solution/stages/ and depends only on the lines before it. Stage 1 adds _pop_op_eqns_backward, the
    upstream backward sweep, beside pop_op_eqns and routes one call site to it; each later stage routes one
    more call site. The last line reverts the four stages and applies solution/reference.patch, so the full
    oracle tree is byte-identical to the base plus the upstream fix.
  ladder:
    - id: S1
      ops: ["+stages/1-remove-from-program.patch"]
      effect: remove_from_program (queuing.py) uses the backward sweep; fixes the CNOT-style family
    - id: S2
      ops: ["+stages/2-controlled-create.patch"]
      effect: create_controlled_op2 (controlled.py) uses it; part of the qp.ctrl family
    - id: S3
      ops: ["+stages/3-controlled-bind.patch"]
      effect: Controlled2._bind_primitive (controlled2.py) uses it; the rest of qp.ctrl, most of the nested family
    - id: S4
      ops: ["+stages/4-adjoint.patch"]
      effect: _make_adjoint_op (adjoint.py) uses it; the qp.adjoint family and the rest of the nested family
    - id: S5
      ops: ["+stages/5-composite-chunked.patch"]
      effect: >-
        remove_from_program takes many operators and CompositeOp2 removes its operands eight at a time, one
        backward sweep per chunk; the qp.prod family clears tau but stays slower than the expert (a partial
        share), because the sweeps still grow with the number of chunks
    - id: U
      ops: ["-stages/5-composite-chunked.patch", "-stages/4-adjoint.patch", "-stages/3-controlled-bind.patch", "-stages/2-controlled-create.patch", "-stages/1-remove-from-program.patch", "+reference.patch"]
      effect: revert the stages and apply the upstream fix

# Item 7j / G-ALT-SOLUTION: three independent correct solutions, each a self-contained solution
# directory (its own solve.sh) that Harbor runs as the oracle.
alternates:
  - name: reverse-search
    path: solution/alternates/reverse-search/solve.sh
    files: [pennylane/core/operator/operator2.py]
    approach: "pop_op_eqns walks each consumed operator's frame from its newest entry and deletes the matching entry in place, one operator at a time with no grouping; a frame with auto_dce raises RuntimeError instead of asserting."
  - name: tail-peek
    path: solution/alternates/tail-peek/solve.sh
    files: [pennylane/core/queuing.py, pennylane/ops/op_math/controlled.py, pennylane/ops/op_math/controlled2.py, pennylane/ops/op_math/adjoint.py]
    approach: "pop_op_eqns is left as at base; a new drop_captured_eqns in queuing.py pops the newest entry when it is the target and otherwise falls back to the full filter, and remove_from_program, create_controlled_op2, Controlled2._bind_primitive and _make_adjoint_op call it; a frame with auto_dce raises ValueError."
  - name: suffix-sweep
    path: solution/alternates/suffix-sweep/solve.sh
    files: [pennylane/core/operator/operator2.py]
    approach: "pop_op_eqns groups its targets by frame and a new _sweep_suffix reads each frame backwards only until every target is seen, then rebuilds that suffix by slice assignment, resolving each entry once; a frame with auto_dce raises NotImplementedError."
alternates_literal_rule: >-
    Every identifier the grader requires exists at the base commit: the expert test file imports
    pennylane.core.operator.operator2.pop_op_eqns and jax's JaxprStackFrame, calls pop_op_eqns with a list
    and reads frame.tracing_eqns through add_eqn, and builds CNOT, adjoint and ctrl programs; none of these
    is new in the upstream fix. The upstream helper names (targets_by_frame) and the new remove_from_program
    signature (*ops) are required by no check, and tail-peek leaves pop_op_eqns untouched while the other
    two rename every local, so the grader is varied away from the gold patch's identifiers. No grader
    literal appears in instruction.md or needs to.

