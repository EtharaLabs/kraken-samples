  - {id: C2, kind: VALUE, check: "operator-removal API digest (single positional remove_from_program, generator input to pop_op_eqns, nested frames, queuing mode) equals the base commit's"}
  - {id: C3, kind: DIVERGENCE, check: "every timed hidden workload's traced-program digest equals the base commit's"}
  - {id: C4, kind: INVARIANT, check: "every repository test the base commit passes still passes"}
  - {id: C5, kind: VALUE, check: "every test of the expert's added test file passes"}
  - {id: C6, kind: VALUE, check: "per-family speedup ratio against the expert, gated by tau"}
  - {id: C7, kind: ABSENCE, check: "no red line RL1 to RL4 fires"}

# Reward Kit layout. Every file named here is generated by recompute.py.
reward_kit:
  release: "harbor-rewardkit 0.2.4 at Harbor fdba28fc411e47e8765420a1a063b4918fce3def"
  files:
    - {id: test_output, file: tests/test_output.py, mode: compiled, role: graded, component_weight: compiled_total}
    - {id: judge, file: tests/judge.toml, mode: judged, role: graded, component_weight: judged_total}
    - {id: diag_correctness, file: tests/diag_correctness.py, mode: compiled, role: diagnostic, component_weight: 0}
    - {id: diag_speedup, file: tests/diag_speedup.py, mode: compiled, role: diagnostic, component_weight: 0}
  reward_toml: tests/reward.toml
  compiled_only_reward_toml: tests/reward.compiled.toml
  reward_keys: [reward, correctness, worst_case_speedup]
  evidence:
    submission_diff: /logs/verifier/evidence/submission_diff.txt
    test_log: /logs/verifier/evidence/test_log.txt
    workload_output: /logs/verifier/evidence/workload_output.json
    timing_record: /logs/verifier/evidence/timing_record.json
    scan_record: /logs/verifier/evidence/scan_record.json
  gates:
    - {id: G1, check: "the measurement record exists and has status ok"}
    - {id: G2, check: "no red line RL1 to RL4 fired"}
    - {id: G3, check: "every correctness check passed (C1 to C5)"}
    - {id: G4, check: "at least one family clears tau on T_base / T_patch at every one of its hidden sizes (checker obligation: worst-case speedup clears the calibrated threshold)"}
  credit: >-
    P = sum over the five families of w_f * SR_f, w_f from hidden_workloads.family_weights (1/8 for each of cnot,
    ctrl, adj and adjctrl, 1/2 for prod). SR_f = 0 when any hidden size of f has T_base / T_patch below
    tau; otherwise r_f = min over the sizes of T_expert / T_patch and SR_f = 1 when kappa * r_f >= 1, else
    clamp(r_f, 0, 1). kappa (timing.kappa) is the declared full-credit tolerance: a patch whose time is
    within the noise band of the expert's earns exactly the expert's share.
  compiled_item_rule: >-
    Every compiled item scores its own relation, whatever the gates say. A D1 timing item scores SR_f for its
    family. Every other compiled item scores P when its relation holds and 0 when it fails, where the
    relation of a prohibition (negate true) holds when the prohibited act is absent. Its verdict is accept
    when its score is above 0, else reject; tests/judge_guard.py writes every item's score, relation and
    verdict to /logs/verifier/compiled/verdicts.json beside the compiled record. With every gate open every
    relation holds, so the compiled component equals P and each family earns its own weight w_f of it.
  judged_item_rule: >-
    tests/test.sh opens the judge only when every gate holds: the compiled-only correctness diagnostic is 1.0
    (G1 to G3) and the compiled-only reward is above zero (G4, since no compiled item scores above zero when
    every family share is zero). Otherwise it writes reward 0.0 with the compiled diagnostics and calls no
    judge, so any red line or failed correctness instance sets the reward to zero and judged items never run
    after a failed gate.
  aggregation: >-
    reward = (compiled_total * compiled_component + judged_total * judged_component) / (compiled_total + judged_total),
    the weighted mean of every rubric item under its item weight; compiled_total and judged_total are the item
    weight sums recompute.py writes into tests/reward.toml.

judge:
  carrier: tests/judge.toml, criteria type binary; its [judge] table carries only the evidence files and batched mode, never a model; the model comes from REWARDKIT_JUDGE
  passthrough: [REWARDKIT_JUDGE, KRAKEN_JUDGE_LINEAGE, LITELLM_PROXY_API_BASE, LITELLM_PROXY_API_KEY]
  excluded_lineages: [anthropic, meta]
  excluded_lineage_basis: authoring lineage Anthropic; requirements/client.md names GPT-6.1-sol (OpenAI), Opus 5.5 and Fable 5.1 (Anthropic) and Muse Spark 1.3 Max (Meta). OpenAI is admitted by operator decision of 2026-10-28 (contract revision 8); a GPT judge scoring a GPT-6.1-sol submission is same-lineage, and those judged scores are reported as such and carry no weight in any disposition for that model
  excluded_model_families: [claude, opus, fable, muse]
  guard_reasons: [judge-variable-missing, judge-lineage-excluded, judge-model-family-excluded, judge-unavailable]
  execution_here: not executed; no judge is reachable from the authoring host, so every judged item is recorded as not executed

policy:
  source: contract policy block (Phase build item 2d)
  channels:
    filesystem_read: restricted
    filesystem_write: restricted
    process_execution: allowed
    network: denied
    environment_variables: restricted
    clock_and_timing: restricted
    ipc: denied
    resources: restricted
    privilege: denied

rubric:
  - id: d1_outcome_cnot_speedup
    obligation: D1
    dimension: outcome
    weight: 1
    negate: false
    evaluation_target: timing_record
    criterion: "On the hidden CNOT-style family (CNOT, CZ, CY, CH, CRX, CRY, CRZ, CRot, ControlledPhaseShift, Toffoli, CSWAP, CCZ at 9000 and 13000 gates), T_base / T_patch clears tau at every size, and the score is the minimum over sizes of T_expert / T_patch, clamped to [0, 1]."
    judgment: {type: VALUE, relation: sr_family_cnot}
    evidence: [/logs/verifier/evidence/timing_record.json]
    mode: compiled
  - id: d1_coverage_ctrl_speedup
    obligation: D1
    dimension: coverage
    weight: 1
    negate: false
    evaluation_target: timing_record
    criterion: "On the hidden qp.ctrl family (Controlled RX, RY, RZ, Rot, Hadamard, PhaseShift, SX, PauliY, IsingZZ with one to three controls at 7000 and 10000 operators), T_base / T_patch clears tau at every size, and the score is the minimum over sizes of T_expert / T_patch, clamped to [0, 1]."
    judgment: {type: VALUE, relation: sr_family_ctrl}
    evidence: [/logs/verifier/evidence/timing_record.json]
    mode: compiled
  - id: d1_coverage_adj_speedup
    obligation: D1
    dimension: coverage
    weight: 1
    negate: false
    evaluation_target: timing_record
    criterion: "On the hidden qp.adjoint family (Adjoint of S, T, SX, RX, RY, RZ, Rot, PhaseShift at 10000 and 14000 operators), T_base / T_patch clears tau at every size, and the score is the minimum over sizes of T_expert / T_patch, clamped to [0, 1]."
    judgment: {type: VALUE, relation: sr_family_adj}
    evidence: [/logs/verifier/evidence/timing_record.json]
    mode: compiled
  - id: d1_coverage_adjctrl_speedup
    obligation: D1
    dimension: coverage
    weight: 1
    negate: false
    evaluation_target: timing_record
    criterion: "On the hidden nested family qp.adjoint(qp.ctrl(base)) at 5500 and 8500 operators, T_base / T_patch clears tau at every size, and the score is the minimum over sizes of T_expert / T_patch, clamped to [0, 1]."
    judgment: {type: VALUE, relation: sr_family_adjctrl}
    evidence: [/logs/verifier/evidence/timing_record.json]
    mode: compiled
  - id: d1_coverage_prod_speedup
    obligation: D1
    dimension: coverage
    weight: 5
    negate: false
    evaluation_target: timing_record
    criterion: "On the hidden prod workloads (one qp.prod call over 10000 and over 15000 factors, each traced once in a fresh process), every size clears T_base / T_patch >= tau and the family share SR_prod = 1 when kappa * min over sizes of T_expert / T_patch >= 1, else that ratio clamped to [0, 1]."
    judgment:
      type: VALUE
      relation: sr_family_prod
    evidence:
      - /logs/verifier/evidence/timing_record.json
    mode: compiled
  - id: d1_constraints_program_equality
    obligation: D1
    dimension: constraints
    weight: 5
    negate: false
    evaluation_target: workload_output
    criterion: "For each of the six verify-time seeds, the sha256 of str(jax.make_jaxpr(mixed_program)(0.0)) on the graded tree equals the base commit's, computed live (checker C1)."
    judgment: {type: DIVERGENCE, relation: check_programs}
    evidence: [/logs/verifier/evidence/workload_output.json]
    mode: compiled
  - id: d1_constraints_base_tests_pass
    obligation: D1
    dimension: constraints
    weight: 5
    negate: false
    evaluation_target: test_log
    criterion: "Every repository test under the selection (tests/capture, tests/core, tests/test_queuing.py and the op_math adjoint, controlled, composite, prod, pow and symbolic files) that passes at d5e813f5ae304acb0e90251351b9b9ea4328a895 still passes on the graded tree (checker C4)."
    judgment: {type: INVARIANT, relation: check_base_tests}
    evidence: [/logs/verifier/evidence/test_log.txt]
    mode: compiled
  - id: d1_robustness_removal_api
    obligation: D1
    dimension: robustness
    weight: 3
    negate: false
    evaluation_target: workload_output
    criterion: "The removal API probe (single positional remove_from_program, a generator passed to pop_op_eqns, a second pop over already-detached operators, removal across a qp.for_loop frame, and remove_from_program with capture disabled under AnnotatedQueue) produces the base commit's digest (checker C2)."
    judgment: {type: VALUE, relation: check_api}
