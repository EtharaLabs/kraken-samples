reward:
  formula: >-
    When G1 to G4 all hold, reward = weighted mean of every rubric item under its item weight
    (reward_kit.aggregation): (55 * compiled_component + 11 * judged_component) / 66. The compiled
    component equals P = sum over the five families of w_f * SR_f, with w_f = 1/8 for each of cnot, ctrl,
    adj and adjctrl and w_prod = 1/2 (hidden_workloads.family_weights), where SR_f = 0 when any size of f has
    T_base / T_patch below tau; otherwise, with r_f = min over sizes of T_expert / T_patch, SR_f = 1 when
    kappa * r_f >= 1 (the patch is within the full-credit band of the expert) and clamp(r_f, 0, 1) otherwise.
    When any gate fails, tests/test.sh writes reward 0.0 and no judge runs.
  aggregation_over_workloads: weighted sum of per-family SR under family_weights, each family the worst case over its sizes
  family_weighting_basis: >-
    The reference fix has two parts of equal size: single removal (pop_op_eqns in operator2.py and
    remove_from_program in queuing.py) and the removal of many operators in one call (CompositeOp2 in
    composite2.py and prod in prod.py, routed through the per-frame backward sweep that groups targets by
    frame and stops once every target is found). The timed credit gives each part one half: the four
    single-removal families one eighth each, the qp.prod family one half. The per-family rubric items carry
    weight 1 for each single-removal family and 5 for prod, the nearest split on the [1, 3, 5] weight scale
    (4 : 5). Order of events, recorded so a reviewer can weigh it: equal fifths were in force when the W6
    per-operator reverse search of an Opus 5.5 trajectory scored compiled 0.80; a probe of eleven constructs
    found the only separating ones all go through the same composite removal path, so adding them as
    families would have counted one miss several times; the operator chose this two-part split (contract
    revision 7, 2026-10-28) instead. Under it W6 re-scores to compiled 0.491 from its recorded measurement.
  no_op_rule: the unmodified tree has T_base / T_patch near 1, below tau for every family, so G4 fails, tests/test.sh writes reward 0.0, no judge runs, and the reward is exactly 0.0
  diagnostics:
    correctness: 1.0 when the measurement is usable and every correctness check (programs, removal API, timed digests, base and expert tests) passes, else 0.0; red lines do not enter it, they zero the reward and are listed in the scan record
    worst_case_speedup: minimum over all hidden (family, size) of T_base / T_patch; 0.0 when the measurement is unusable

research_basis:
  note: each part of the reward formula, the paper in research/paper/ that grounds it, and how far this task follows it; quotes are verbatim from the extracted text
  parts:
    - part: per-family speed ratio SR_f = T_expert / T_patch
      source: 2511.06090v3 SWE-fficiency, section 2 (Evaluation metrics)
      quote: "we compute the instance speedup ratio as SR = SpeedupLM/Speedupgold where gold speedup is Speedupgold = Tpre/Tpost-gold-patch and LM speedup is SpeedupLM = Tpre/Tpost-LM-patch"
      also: 2505.23671v3 GSO, section 2.3, speedup against the human target S(Ch, Ca)
      follows: exactly
    - part: correctness gate (repository tests, hidden correctness checks, no red line) before any speed credit
      source: 2511.06090v3 SWE-fficiency, section 2
      quote: "If the patch applies successfully and all tests pass, we compute the instance speedup ratio ... a patch that fails unit tests, the instance's speedup ratio is similarly clamped to max(1/Speedupgold, SRmin)"
      also: 2505.23671v3 GSO, OPTp requires correct(Ca)
      follows: yes; this task pays 0.0 rather than the paper's small positive floor
    - part: full-credit band kappa = 1.20
      source: 2505.23671v3 GSO, section 2.4
      quote: "we denote OPT@K as the OPT0.95@K metric that uses a 95% threshold for evaluating success against the human target"
      follows: same construction (a patch close enough to the expert counts as matching it); GSO's 0.95 corresponds to kappa 1.053, this task keeps 1.20 by operator decision of 2026-10-27, grounded in the measured host noise (timing.calibration)
    - part: noise gate tau = 1.25 on T_base / T_patch
      source: 2511.06090v3 SWE-fficiency, appendix E.5
      quote: "We filter away any instances where µpre-µpost <= 2σpost ... we also run correctness tests ten times to filter out any possible flaky tests"
      follows: in spirit; the value 1.25 comes from this task's base-against-base calibration
    - part: one fresh process per timing, first call only, no state kept across timings (RL2)
      source: 2607.19653v1 PerfAgent, section on reward hacking
      quote: "The most common hack we observed was caching results inside benchmark timing loops. SWE-fficiency's harness runs each evaluation in a separate Python process to prevent run-to-run caching of results"
      also: 2511.06090v3 SWE-fficiency, "our harness rejects submitted solutions that exploit 'compute once, re-use forever' across timing runs"; 2505.23671v3 GSO appendix, memoization patches gaming repeated-call tests
      follows: yes
    - part: aggregation, worst case over sizes within a family, then a weighted sum over the five families (1/8 for each single-removal family, 1/2 for prod)
      source: 2505.23671v3 GSO, section 2.3; 2511.06090v3 SWE-fficiency, section 2
      quote: "we compute speedup using the harmonic mean of individual test speedups which is more robust to extreme positive outliers"
      also: 2511.06090v3 SWE-fficiency, section 2, "To aggregate across instances, we take the harmonic mean of each task SR, applying a per-instance lower bound of SRmin = 0.001"
      follows: partly; the worst case within a family is stricter than a harmonic mean. Across families this task takes a weighted arithmetic sum, not the papers' harmonic mean, which with the SRmin floor would score any patch that misses one family near zero and so pay no partial credit. The family weights (contract revision 7) follow the two equal parts of the reference fix and are not taken from a paper; reward.family_weighting_basis records how they were chosen
    - part: per-family partial credit
      source: 2605.02944v1 pass-rate reward in RL for code
      quote: "despite alleviating reward sparsity, pass-rate rewards do not reliably improve final performance over binary rewards"
      follows: counter-evidence recorded; this task's partial credit is paid by speed family only after every correctness check passes, which is the lever the credit-assignment category tests
    - part: cap of each family share at 1.0
      source: 2511.06090v3 SWE-fficiency, section 2
      quote: "We adopt speedup ratio because it provides a long runway for progress and explicitly rewards surpassing experts"
      follows: no; Harbor rewards lie in [0, 1] and the oracle must earn exactly 1.0, so surpassing the expert is not paid
    - part: compiled 55 / judged 11 weight split
      source: contract revision 4 rubric.compilation_floor_basis (2609.04298v3, 2606.26300v2, 2604.28093v1, 2605.12673v1)
      follows: policy choice; no paper in the corpus states a numeric split

