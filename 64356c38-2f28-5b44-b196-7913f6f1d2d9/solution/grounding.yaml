      interleaved across workloads and trees, run of 2026-10-27 (rig /tmp author script calib.py)
    single_run_spread_max_over_min:
      base: {adj_10000: 1.148, adj_14000: 1.224, adjctrl_5500: 1.134, adjctrl_8500: 1.213, cnot_9000: 1.213, cnot_13000: 1.340, ctrl_7000: 1.151, ctrl_10000: 1.200}
      expert: {adj_10000: 1.174, adj_14000: 1.089, adjctrl_5500: 1.156, adjctrl_8500: 1.150, cnot_9000: 1.151, cnot_13000: 1.109, ctrl_7000: 1.142, ctrl_10000: 1.151}
    median_of_3_ratio_interleaved_max:
      base: {adj_10000: 1.084, adj_14000: 1.001, adjctrl_5500: 1.014, adjctrl_8500: 1.104, cnot_9000: 1.025, cnot_13000: 1.054, ctrl_7000: 1.078, ctrl_10000: 1.036}
      expert: {adj_10000: 1.026, adj_14000: 1.016, adjctrl_5500: 1.006, adjctrl_8500: 1.063, cnot_9000: 1.042, cnot_13000: 1.029, ctrl_7000: 1.023, ctrl_10000: 1.019}
    median_of_3_ratio_any_split_max: {base: 1.200, expert: 1.112}
    min_of_3_ratio_any_split_max: {all_trees: 1.199}
    prod_family: >-
      run of 2026-10-27 (calib_prod.py, 6 interleaved fresh-process first calls per tree, verifier image, 2 CPUs):
      base-against-base min-of-3 split max 1.021 (k=10000) and 1.088 (k=15000); expert-against-expert 1.023 and 1.012,
      so tau = 1.25 and kappa = 1.20 hold. Expert speedup (min) 2.62x and 3.61x. A per-operator reverse search
      (the 17-line fix an Opus 5.5 trajectory produced) reads base/patch 0.98 and 0.91, so it clears no tau and earns
      SR_prod = 0, while it matches the expert on the four single-removal families.
    statistic_switch_check: re-scoring every recorded control with the minimum instead of the median changes no outcome; oracle and alternates stay 1.0, ladder 1, 0.690, 0.405, 0.25, 0, every gate-closed control stays 0.0
    expert_speedup_median_of_6: {adj_10000: 2.358, adj_14000: 2.954, adjctrl_5500: 1.853, adjctrl_8500: 2.258, cnot_9000: 2.206, cnot_13000: 2.822, ctrl_7000: 1.992, ctrl_10000: 2.633}
    drift: the last two of the six repetitions ran 5 to 17 percent faster on every tree at once, so the host drifts between repetitions; the verifier times base, expert and patch back to back inside each repetition, which shares that drift
    previous_shared_host_run: {single_run_spread_max: 1.190, median_of_3_ratio_max: 1.063, oracle_k2_worst_expert_over_patch: 1.107}
    rule: >-
      tau = 1.25 stays above every base-against-base median-of-3 ratio observed, over every split of the six
      runs into two triples (1.200), so the unmodified tree cannot clear the gate on noise; a single run is
      never gated. kappa = 1.20 sits above the largest expert-against-expert median-of-3 ratio (1.112 over
      every split, 1.063 interleaved) and above the oracle's worst ratio on the shared host (1.107), so the
      upstream fix earns exactly 1.0 on every family under host noise.
    repetitions: >-
      five repetitions per tree and workload (median of 5). A first oracle run on this image with three
      repetitions paid compiled 1.0 but read T_expert / T_patch = 0.841 on ctrl 10000, inside the band by
      0.008: single runs of the same tree spread up to 1.81x (3.71 s to 6.72 s) while the authoring session
      itself kept about one core busy, and the Docker VM's vCPUs land on efficiency or performance cores of
      the M1 Pro host at the scheduler's choice. A median of 5 discards two slow outliers instead of one.
    kappa_gap: >-
      a family earns full credit only when T_patch is within 1.20 of T_expert at every size, i.e. a speedup of
      at least T_base / (1.20 T_expert); the smallest expert speedup is 1.85 (adjctrl 5500), so a fully paid
      patch is at least 1.54x faster than base there and at least 0.833 of the expert's speed everywhere.
      The partial fixes measured on the oracle ladder sit at 0.73 or below on the families they only
      partly fix, so the band does not pay them in full.

