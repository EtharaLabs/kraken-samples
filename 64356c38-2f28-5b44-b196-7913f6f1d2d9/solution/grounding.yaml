open_issues:
  - "Contract revision 4 corrects the slot target and discovery DV1: pop_op_eqns is defined in pennylane/core/operator/operator2.py and reached through remove_from_program in pennylane/core/queuing.py; this draft is slot 1 of revision 4 (slot 5 of revision 3)."
  - "Canary slots hold placeholders; bundle_mint fills them at mint."
  - "Checker obligation 3 (worst-case speedup clears the threshold) is realized as gate G4 per family so the credit-assignment slot can pay a partial fix by family; a fully global worst case would make the reward all-or-nothing, which DV4 rules out."
  - "Judged items cannot be scaled by the credit P, so a partial fix that passes G1 to G4 can collect judged weight (at most 11 / 66 = 0.167) beyond its compiled share. Every judged weight is 1 for this reason: with the old judged total of 22 no ladder could keep every step under the declared discrimination weight 0.5 and also never rise for every judged outcome."
  - "Ladder monotonicity under an adversarial judge: rungs keep-1 (P = 0.25) and keep-2 (P = 0.399) overlap when the judge pays keep-1 at least 0.33 of the judged weight more than keep-2; the two diffs differ by one routed call site, so an honest judge scores them alike. Every other step is monotone and at most 0.5 for every judged outcome (CONTROLS.md)."
  - "kappa = 1.20 pays a family in full when its time is within 20 percent of the expert's; a patch slower than that keeps T_expert / T_patch. The band is set by the host noise measured here; a quieter grading host could lower it."
  - "The timed controls ran on the native linux/arm64 verifier image on one host (EC2, 16 cores, 2 CPUs per verifier container). Both task images were built for linux/amd64 and linux/arm64 from the same environment/ and tests/ bytes; the final indexes are bound in contract delivery.platform_manifests (env a7a1b2ba, verifier 661e6b82). The smoke below ran on the 2026-10-28 builds of the same sources (env 943db5f0, verifier 54ca70f2); the verifier was rebuilt afterwards only for the revision 8 judge guard and the removal of a stray authoring-host __pycache__ file, neither of which the smoke exercises. Under amd64 emulation the base pass set equals arm64 (3821 tests each), the oracle tree reproduces the visible program digest 92d44047, tests/core/operator passes (646 passed, 9 skipped) and the expert test file passes (11). Emulated timings carry no meaning and were not used."
  - "K3, K4 and K5 were re-run on the final verifier image on 2026-10-27 (20:25 to 22:03 IST); R3 and R4 ran on an arm64 verifier image built from the same tests/ bytes on a second host, because their verdict is decided by the red-line scans, not by timing."
  - "Judged items not executed: no judge reachable from the authoring host."
  - "Harness integrity is split (operator decision of 2026-10-27): an /opt/kraken file that differs from the bundle before the submission runs is a verifier error, a harness file that changes during the submission run is RL1. /tests files are excluded from the before-run check because the CRUCIBLE impossible-test probe edits them on purpose; they stay in the during-run check."

